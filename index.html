<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Harpreet Khaira — résumé">
  <meta name="theme-color" content="#0b1220">
  <title>Harpreet Khaira — Résumé</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1220; color: #f8fafc; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); text-align: center; }
    .card { padding: clamp(30px, 7vw, 64px); border: 1px solid #273449; border-radius: 24px; background: linear-gradient(145deg, #111c30, #0e1728); box-shadow: 0 24px 80px #0008; }
    .eyebrow { margin: 0 0 12px; color: #7dd3fc; font-size: .82rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.1rem, 8vw, 4.5rem); line-height: 1; letter-spacing: -.045em; }
    .subtitle { margin: 18px auto 30px; max-width: 42ch; color: #b8c5d8; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px; border-radius: 999px; font-weight: 750; text-decoration: none; transition: transform .15s ease, background .15s ease; }
    a:hover { transform: translateY(-2px); }
    .primary { background: #38bdf8; color: #06131f; }
    .secondary { border: 1px solid #53627a; color: #f8fafc; background: #ffffff08; }
    footer { margin-top: 18px; color: #718096; font-size: .78rem; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="eyebrow">Résumé</p>
      <h1>Harpreet Khaira</h1>
      <p class="subtitle">AI engineer building reliable agentic systems and production-grade AI products.</p>
      <div class="actions">
        <a class="primary" href="harpreet-khaira-resume.pdf" target="_blank" rel="noopener">View résumé</a>
        <a class="secondary" href="harpreet-khaira-resume.pdf" download>Download PDF</a>
      </div>
    </section>
    <footer>Last updated August 2026</footer>
  </main>
</body>
</html>
